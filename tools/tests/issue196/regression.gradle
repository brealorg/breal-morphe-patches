import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.JavaExec

gradle.projectsEvaluated {
    def p = gradle.rootProject
    p.pluginManager.apply("java-base")
    def cp = p.configurations.create("issue196RegressionClasspath")
    cp.canBeResolved = true
    cp.canBeConsumed = false
    cp.attributes.attribute(org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE,
            p.objects.named(org.gradle.api.attributes.Usage, org.gradle.api.attributes.Usage.JAVA_RUNTIME))
    p.dependencies.add(cp.name, "com.fasterxml.jackson.core:jackson-databind:2.6.0")
    p.dependencies.add(cp.name, "com.squareup.okhttp3:okhttp-jvm:5.3.2")
    p.repositories.mavenCentral()
    def testDir = p.file("tools/tests/issue196")
    def sourceRoot = "extensions/boostforreddit/src/main/java/app/morphe/extension/boostforreddit/"
    def realSources = ["http/arcticshift/ArcticShift.java", "http/reddit/RedditApiUtils.java",
                       "utils/EditableObjectNode.java", "http/reddit/RedditSubredditUndeleteInterceptor.java",
                       "http/reddit/RedditMediaUndeleteInterceptor.java", "http/imgur/ImgurUndeleteInterceptor.java",
                       "http/wayback/WaybackResponse.java"].collect { p.file(sourceRoot + it) }
    def fixtureSources = p.fileTree(testDir) { include "**/*.java" }
    def registerRun = { String suffix, File interceptor, boolean baseline ->
        def compileTask = p.tasks.register("compileIssue196" + suffix, JavaCompile) {
            source(realSources, interceptor, fixtureSources)
            classpath = cp
            destinationDirectory.set(p.layout.buildDirectory.dir("issue196/" + suffix))
            options.encoding = "UTF-8"
            options.release.set(17)
        }
        p.tasks.register("issue196" + suffix, JavaExec) {
            dependsOn(compileTask)
            classpath = p.files(compileTask.flatMap { it.destinationDirectory }) + cp
            mainClass.set("Issue196RegressionTest")
            if (baseline) { args("--baseline") }
        }
    }
    // The real WaybackMachine, with the issue196 HttpUtils/cache/logging fixtures instead of the stub.
    def waybackCompile = p.tasks.register("compileWaybackRegression", JavaCompile) {
        source(p.files(sourceRoot + "http/wayback/WaybackMachine.java", sourceRoot + "http/wayback/WaybackResponse.java",
                sourceRoot + "utils/CompatibleRateLimiter.java"),
                p.fileTree(testDir) { include "fixtures/**/http/HttpUtils.java", "fixtures/**/http/AutoSavingCache.java",
                        "fixtures/**/utils/LoggingUtils.java" },
                p.file("tools/tests/wayback/WaybackMachineRegressionTest.java"))
        classpath = cp
        destinationDirectory.set(p.layout.buildDirectory.dir("issue196/wayback"))
        options.encoding = "UTF-8"
        options.release.set(17)
    }
    def waybackRun = p.tasks.register("waybackRegressionTest", JavaExec) {
        dependsOn(waybackCompile)
        classpath = p.files(waybackCompile.flatMap { it.destinationDirectory }) + cp
        mainClass.set("WaybackMachineRegressionTest")
    }
    def current = p.file(sourceRoot + "http/reddit/RedditSubmissionUndeleteInterceptor.java")
    def candidate = registerRun("RegressionTest", current, false)
    candidate.configure { dependsOn(waybackRun) }
    def baselineFile = p.findProperty("issue196Baseline")
    if (baselineFile != null) {
        def baseline = registerRun("BaselineProof", p.file(baselineFile), true)
        candidate.configure { dependsOn(baseline) }
    }
}
